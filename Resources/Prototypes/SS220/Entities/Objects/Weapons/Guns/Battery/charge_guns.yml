- type: entity
  name: retro laser blaster
  parent: [ BaseWeaponBatterySmall]
  id: WeaponChargeLaserGun
  description: brr brr potapim needs new description
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/laser_retro.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Item
    storedOffset: 0,-5
  - type: HitscanBatteryAmmoProvider
    proto: RedMediumLaser
    fireCost: 62.5
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Appearance
  - type: ChargeGun
    chargeTime: 2
    maxChargeCount: 5
    ammoPerCharge: 5
    damagePerCharge:
      types:
        Heat: 30
